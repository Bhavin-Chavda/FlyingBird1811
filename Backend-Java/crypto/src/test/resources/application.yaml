spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  h2:
    console:
      enabled: true
  jwt:
    secret: "mySecretKeyForJWTTokenGenerationAndValidation12345678901234567890"
    expiration: 86400000  # 24 hours in milliseconds
